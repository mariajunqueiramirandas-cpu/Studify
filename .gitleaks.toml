# Secret scan settings (gitleaks, .github/workflows/ci.yml): the default rules, plus test-only placeholders that
# look like keys. Only literal fixtures go here, never a pattern that could match a real secret.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures, not secrets"
# A placeholder signing key used by the API tests in commit 51c305e (now 'x'.repeat(32)); it stays in the history.
# The link site's localStorage item name, assigned to a constant named STORAGE_KEY in commit 78734e0 (now STORAGE_ITEM).
regexes = ['''test-signing-key-0123456789abcdef''', '''studify\.pagina-que-esquece\.v1''']
