name: Android release

# Builds a release APK on the GitHub runner (not EAS cloud), signs it with the persistent release key and
# publishes it as a GitHub Release. Every push to main is a release. Setup: apps/mobile/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the APK and upload it as a workflow artifact, without publishing a release (any branch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false # every main commit gets a release; never cancel one that may be publishing

env:
  # versionCode = github.run_number + offset. The offset keeps new codes above builds made before this workflow.
  ANDROID_VERSION_CODE_OFFSET: '100'
  # SDK packages the generated project builds with (the "[ExpoRootProject] Using the following versions" lines in
  # the Gradle log). Update these when the Expo or React Native version changes. compileSdk 37 is the SDK package
  # platforms;android-37.0 (there is no platforms;android-37).
  ANDROID_COMPILE_SDK: '37.0'
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK: '27.1.12297006'
  # CPU architectures in the APK: 64-bit ARM only. Each ABI compiles every native library again, so this is a
  # quarter of the native work of the default four. 32-bit phones (armeabi-v7a, including Android Go phones with a
  # 32-bit system) and x86 emulators cannot install the release; add those ABIs here (comma-separated) if needed.
  ANDROID_ABIS: 'arm64-v8a'
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  release:
    name: Build and publish the signed Android APK
    # ubuntu-latest is Ubuntu 24.04 at the time of writing; the Android SDK comes preinstalled.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_BASE_URL: ${{ vars.EXPO_PUBLIC_BASE_URL || 'https://studify.vendua.com.br' }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://studify.vendua.com.br/api' }}
      APP_VERSION_SUFFIX: ${{ vars.APP_VERSION_SUFFIX }}
    steps:
      - name: Only build releases from main
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Dry run::Building $GITHUB_REF without publishing a release."
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::Android releases are built from main only (this run is on $GITHUB_REF). Use a dry run to test another branch."
            exit 1
          fi

      - name: Check the release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing secret missing::$name is not set. Create the release keystore and add the secrets as described in apps/mobile/RELEASING.md. Nothing is published, and a debug-signed APK is never released."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check the build-time configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Missing repository variables::Set the Actions variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning title=Google sign-in not configured::EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID is empty."
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the previous release tag and the commit history
      - uses: pnpm/action-setup@v4 # version comes from the packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # RN 0.88's Gradle plugin compiles with a Java 17 toolchain and AGP 9 needs JDK 17 or newer, so 17 is the
      # one JDK that satisfies every module without toolchain auto-provisioning.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Firebase config for remote push (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning title=Remote push off::GOOGLE_SERVICES_JSON_BASE64 is not set, so this build gets no push token. Local reminders, live progress while the app is open and the Central de notificações still work. See apps/mobile/RELEASING.md."
            exit 0
          fi
          file="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$file"
          # The file must be valid JSON and name the app's package, or Gradle fails much later with a vaguer error.
          if ! node -e 'const j=require(process.argv[1]); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==="com.studify.app"); process.exit(ok?0:1)' "$file"; then
            echo "::error title=Bad google-services.json::GOOGLE_SERVICES_JSON_BASE64 does not decode to a google-services.json with an Android app for com.studify.app. See apps/mobile/RELEASING.md."
            exit 1
          fi
          echo "GOOGLE_SERVICES_FILE=$file" >> "$GITHUB_ENV"

      - name: Resolve version, tag and version code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd apps/mobile && npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json")
          version=$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/expo-config.json")
          build="$GITHUB_RUN_NUMBER"
          tag="v${version}-build.${build}"
          if [ "$DRY_RUN" != "true" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "::error title=Release already exists::$tag is already published. Push a new commit to create the next build."
            exit 1
          fi
          {
            echo "APP_VERSION=$version"
            echo "BUILD_NUMBER=$build"
            echo "ANDROID_VERSION_CODE=$((build + ANDROID_VERSION_CODE_OFFSET))"
            echo "RELEASE_TAG=$tag"
            echo "APK_NAME=studify-${version}-build${build}.apk"
          } >> "$GITHUB_ENV"

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/studify-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error title=Keystore check failed::The keystore could not be opened as PKCS12 with ANDROID_KEYSTORE_PASSWORD, or ANDROID_KEY_ALIAS is not in it. See apps/mobile/RELEASING.md."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # The generated gradle.properties gives Gradle a 2 GB heap and 512 MB metaspace. That is too little for this
      # app: R8 and the CMake tasks ran the daemon out of memory, and it stalled in garbage collection instead of
      # failing. The runner has 4 CPUs and 16 GB.
      - name: Tune Gradle for the CI runner
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          # The generated file has no trailing newline; add one so appended lines start on their own line.
          [ -z "$(tail -c 1 gradle.properties)" ] || echo >> gradle.properties
          set_prop() {
            sed -i "/^${1//./\\.}=/d" gradle.properties
            echo "$1=$2" >> gradle.properties
          }
          set_prop org.gradle.jvmargs '-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
          set_prop kotlin.daemon.jvmargs '-Xmx3g'
          set_prop org.gradle.caching 'true'
          set_prop reactNativeArchitectures "$ANDROID_ABIS"
          # PNG crunching re-compresses every image on every build for a small size gain.
          set_prop android.enablePngCrunchInReleaseBuilds 'false'
          grep -v '^#' gradle.properties | grep .

      - name: Install the Android SDK packages the build needs
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          packages=()
          [ -d "$ANDROID_HOME/platforms/android-$ANDROID_COMPILE_SDK" ] || packages+=("platforms;android-$ANDROID_COMPILE_SDK")
          [ -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" ] || packages+=("build-tools;$ANDROID_BUILD_TOOLS")
          [ -d "$ANDROID_HOME/ndk/$ANDROID_NDK" ] || packages+=("ndk;$ANDROID_NDK")
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing SDK packages: ${packages[*]}"
            (yes | "$sdkmanager" --licenses > /dev/null) || true
            "$sdkmanager" --install "${packages[@]}"
          else
            echo "All required SDK packages are already installed."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Most of the build is C++ (reanimated, worklets, MMKV, nitro, screens, …) compiled for every ABI. ccache keeps
      # the compiled objects between runs, so only changed native code is compiled again.
      - name: Cache native compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-release-ndk-${{ env.ANDROID_NDK }}
          max-size: 2G

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          # React Native's CMake helpers pick ccache up from PATH; the launcher variables cover the other libraries.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The NDK is reinstalled on each runner, so compare compilers by content rather than mtime. The sloppiness
          # settings let restored precompiled headers (reanimated) and checked-out headers with new mtimes hit.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          chmod +x ./gradlew
          # Release lint (lintVital*) re-analyzes the whole app on every build. CI typechecks and tests on each PR,
          # so skip it here.
          ./gradlew assembleRelease --console=plain \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          ccache --show-stats

      # The Expo template signs release builds with the debug key. Re-sign with the release key so every
      # build installs over the previous ones.
      - name: Re-sign the APK with the release key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Same build-tools version AGP built with (installed above if missing).
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"

          apk_dir=apps/mobile/android/app/build/outputs/apk/release
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error title=Unexpected APK output::Expected one release APK in $apk_dir, found ${#apks[@]}."
            exit 1
          fi

          out_dir="$RUNNER_TEMP/release"
          mkdir -p "$out_dir"
          aligned="$out_dir/aligned.apk"
          signed="$out_dir/$APK_NAME"

          "$zipalign" -p -f 4 "${apks[0]}" "$aligned"
          "$apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed" \
            "$aligned"
          rm -f "$aligned"
          "$zipalign" -c 4 "$signed"

          "$apksigner" verify --print-certs "$signed" | tee "$out_dir/verify.txt"
          if grep -q 'CN=Android Debug' "$out_dir/verify.txt"; then
            echo "::error title=Debug signature::The APK is still signed with the Android debug key. Not publishing it."
            exit 1
          fi

          cert_sha256=$(grep 'certificate SHA-256 digest' "$out_dir/verify.txt" | head -n 1 | grep -oE '[0-9a-f]{64}' || true)
          if [ "${#cert_sha256}" -ne 64 ]; then
            echo "::error title=Certificate digest missing::apksigner did not print a SHA-256 certificate digest."
            exit 1
          fi
          # assetlinks.json wants the uppercase, colon-separated form.
          fingerprint=$(printf '%s' "$cert_sha256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          # Google sign-in matches the Android OAuth client on the SHA-1 instead (RELEASING.md §7).
          cert_sha1=$(grep 'certificate SHA-1 digest' "$out_dir/verify.txt" | head -n 1 | grep -oE '[0-9a-f]{40}' || true)
          sha1_fingerprint=$(printf '%s' "$cert_sha1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          apk_sha256=$(sha256sum "$signed" | cut -d' ' -f1)

          {
            echo "RELEASE_APK=$signed"
            echo "CERT_SHA256_FINGERPRINT=$fingerprint"
            echo "CERT_SHA1_FINGERPRINT=$sha1_fingerprint"
            echo "APK_SHA256=$apk_sha256"
          } >> "$GITHUB_ENV"

      - name: Write the release notes
        run: |
          set -euo pipefail
          prev_tag=$(git describe --tags --abbrev=0 --match 'v*-build.*' HEAD 2>/dev/null || true)
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Built from commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "Updates install over earlier Studify builds signed with the same release key (applicationId com.studify.app)."
            echo
            if [ -n "$prev_tag" ]; then
              echo "### Changes since \`$prev_tag\`"
              echo
              commits=$(git log --no-merges -n 100 --format='- %s (%h)' "$prev_tag..HEAD")
            else
              echo "### Recent commits"
              echo
              commits=$(git log --no-merges --format='- %s (%h)' -n 20 HEAD)
            fi
            if [ -n "$commits" ]; then echo "$commits"; else echo "No new commits."; fi
          } > "$notes"
          cat "$notes"

      - name: Upload the dry-run APK
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.RELEASE_APK }}
          retention-days: 7

      - name: Publish the GitHub Release
        id: release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url=$(gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --target "$GITHUB_SHA" \
            --title "Studify $APP_VERSION (build $BUILD_NUMBER)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: success()
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## Studify $APP_VERSION (build $BUILD_NUMBER)"
            if [ "$DRY_RUN" = "true" ]; then
              echo
              echo "Dry run: nothing was published. The signed APK is attached to this run as an artifact."
            fi
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Release | ${RELEASE_URL:-not published (dry run)} |"
            echo "| Tag | \`$RELEASE_TAG\` |"
            echo "| versionCode | \`$ANDROID_VERSION_CODE\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo "| APK SHA-256 | \`$APK_SHA256\` |"
            echo
            echo "### Signing certificate SHA-256"
            echo
            echo "Add this to \`apps/site/public/.well-known/assetlinks.json\` (\`sha256_cert_fingerprints\`) if it is not there yet:"
            echo
            echo '```'
            echo "$CERT_SHA256_FINGERPRINT"
            echo '```'
            echo
            echo "### Signing certificate SHA-1"
            echo
            echo "Google sign-in fails with DEVELOPER_ERROR unless an Android OAuth client for \`com.studify.app\` has this SHA-1 (apps/mobile/RELEASING.md §7):"
            echo
            echo '```'
            echo "${CERT_SHA1_FINGERPRINT:-not printed by apksigner}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
