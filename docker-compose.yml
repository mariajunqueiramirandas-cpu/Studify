# Studify backend for Dokploy (Docker Compose app built from this repository).
# Dokploy: create a Compose app from this repo, paste the variables from .env.example into its Environment
# tab (Dokploy writes them to .env next to this file), and add the domain in the Domains tab:
#   service api, container port 3000, HTTPS on, host studify.vendua.com.br, path / (the same container serves the
#   API under /api and the link site at /, /c, /i, /q, /b and /.well-known/assetlinks.json).
# The API has no published ports: Traefik reaches it through dokploy-network (docs/engineering/deployment.md).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Manual Traefik routing, only if the Domains tab is not used (Dokploy generates the same labels):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.studify-api.rule=Host(`studify.vendua.com.br`)
    #   - traefik.http.routers.studify-api.entrypoints=websecure
    #   - traefik.http.routers.studify-api.tls.certresolver=letsencrypt
    #   - traefik.http.services.studify-api.loadbalancer.server.port=3000

  # Queue consumer (pg-boss). Run one replica; see docs/engineering/deployment.md section 4.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    # Lets in-flight jobs finish on SIGTERM (worker/src/index.ts stops pg-boss gracefully).
    stop_grace_period: 60s
    env_file:
      - .env
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
