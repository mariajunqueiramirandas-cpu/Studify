# Supabase CLI configuration. Supabase now provides only Auth (ADR 0012): accounts, sign-in codes and Google sign-in.
# The schema, files and realtime are Studify's own (packages/db, apps/api). Locally, `supabase start` serves Auth at
# http://127.0.0.1:54321; the data lives in your own Postgres (docs/engineering/deployment.md §7).
# Ports follow the Supabase CLI defaults. Local setup: docs/engineering/mobile-app.md §18.
project_id = "studify"

[api]
enabled = true
port = 54321
# Nothing of Studify's is read through Supabase's table API any more; the gateway stays on for Auth.
schemas = ["graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Postgres 15+ is required (data-model §1). 17 is the current CLI default.
major_version = 17

[studio]
enabled = true
port = 54323

# Files and realtime are served by the API (apps/api/src/storage, apps/api/src/realtime).
[storage]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
# Native app: the deep link is the redirect target for OTP and OAuth flows (mobile-app.md §2.3, §12).
site_url = "studify://auth/callback"
additional_redirect_urls = ["studify://auth/callback", "https://studify.vendua.com.br"]
enable_signup = true

[auth.email]
enable_signup = true
# Email sign-in uses a one-time code, not a password. Six digits, valid for one hour.
otp_length = 6
otp_expiry = 3600

# The app asks for the 6-digit code, so both e-mails must show {{ .Token }}; Supabase's default templates only
# carry a link. A new address gets "confirmation", a known one gets "magic_link" (sign-in, and the re-auth before
# Recomeçar do zero and account deletion). The subject carries the code too, so it shows in the notification.
# The e-mails have no sign-in link on purpose: link scanners (Outlook Safe Links, antivirus) open it and burn the
# code before the student types it. The hosted project does not read this file: push it with
# `supabase config push` or paste the templates under Auth > Email Templates.
[auth.email.template.confirmation]
subject = "{{ .Token }} é seu código do Studify"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "{{ .Token }} é seu código do Studify"
content_path = "./supabase/templates/magic_link.html"

# Hosted project only (`supabase link --project-ref pwigsfpkyxdtorxvwpnt`, then `supabase config push`). Local runs
# keep the CLI's built-in mail catcher. Supabase still generates the codes and renders the templates above; Resend
# only delivers them. RESEND_API_KEY must be set in the shell that runs `config push` (RELEASING.md §8).
[remotes.production]
project_id = "pwigsfpkyxdtorxvwpnt"

[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "studify@auto.vendua.com.br"
sender_name = "Studify"

# The built-in sender allows 2 e-mails per hour; with custom SMTP the limit is ours to set.
[remotes.production.auth.rate_limit]
email_sent = 100
